<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select options</title>
</head>

<body>

    <h1>Select Options</h1>
    <!-- select is used to create a dropdown list -->
    <!-- option is used to create an option in the dropdown list -->
    <!-- value is the value that will be sent to the server when the form is submitted -->
    <!-- selected is the attribute that makes the option selected by default -->
    <!-- optgroup is used to group related options in the dropdown list -->
    <!-- label is the attribute that specifies the label for the optgroup -->
    <label for="cars">Choose a car:</label>
    <select name="cars" id="cars">
        <optgroup label="Volvo">
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>

        </optgroup>
        <optgroup label="Mercedes">
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
        </optgroup>
    </select>
    <hr>
    <!--------------------------------------------->
    <!-- datalist is used to create a list of predefined options for an input field -->
    <!-- input is used to create an input field -->
    <!-- list is the attribute that specifies the id of the datalist element -->
    <input list="browsers" name="browser" id="browser">
    <datalist id="browsers">
        <option value="Chrome">
        <option value="Firefox">
        <option value="Internet Explorer">
        <option value="Opera">
        <option value="Safari">
        <option value="Microsoft Edge">
    </datalist>
    <input type="submit" value="Submit">
</body>

</html>
