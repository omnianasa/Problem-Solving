<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
</head>

<body>
    <form action="/submit" method="post">
        <!-- input type="submit" is used to create a submit button -->
        <!-- input type="reset" is used to create a reset button -->
        <!-- button type="submit" is used to create a submit button -->
        <!-- button type="reset" is used to create a reset button -->
        <!-- button type="button" is used to create a button that does not submit or reset the form -->
        <h1>Buttons</h1>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button" onclick="alert('Button clicked!')">Click Me</button>
        <button type="button" onclick="window.location.href='https://www.example.com'">Go to Example.com</button>
        <button type="button" onclick="window.print()">Print this page</button>
    </form>
</body>

</html>
