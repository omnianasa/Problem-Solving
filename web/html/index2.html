<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>images</title>
</head>

<body>
    <!-- The <img> tag is used to embed an image in an HTML page. -->
    <!-- The src attribute specifies the path to the image file. -->
    <!-- The alt attribute provides alternative text for the image if it cannot be displayed. -->
    <!-- The width and height attributes specify the dimensions of the image. -->
    <h1>Local Image</h1>
    <img title="Local Image" src="girl.jpg" alt="a girl setting on a chair" width="100%" height="100%">
    
    <h1>External Image</h1>
    <img title="External Image" src="https://i.pinimg.com/736x/f2/ef/09/f2ef09e7754e6177e71ee8ce31d0f58a.jpg"
        alt="yellow with a distracted man with red shirt" width="100%" height="100%">


</body>

</html>
