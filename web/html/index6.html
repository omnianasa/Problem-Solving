<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Ideas</title>
</head>

<body>
    <h1>List of Ideas</h1>
    <!-- ul refers to an unordered list -->
    <ul>
        <!-- li refers to a list item -->
        <li>Idea 10</li>
        <li>Idea 22</li>
        <li>Idea 15</li>
    </ul>

    <!--ol refers to an ordered list-->
    <!-- type="A" refers to the type of numbering used in the list (Uppercase Letters)-->
    <!-- type="a" refers to the type of numbering used in the list (Lowercase Letters) -->
    <!-- type="I" refers to the type of numbering used in the list (Uppercase Roman Numerals) -->
    <!-- type="i" refers to the type of numbering used in the list (Lowercase Roman Numerals) -->
    <!-- type="1" refers to the type of numbering used in the list (Numbers) -->
    <!-- reversed="reversed" refers to the list being displayed in reverse order -->
    <!--start refers to the starting number of the list -->
    <ol type="1" reversed start="5">
        <li>Idea 10</li>
        <li>Idea 22</li>
        <li>Idea 15</li>
    </ol>


    <!--description list-->
    <dl>
        <!--dt stands for definition term-->
        <dt>Idea 10</dt>
        <!--dd stands for definition description-->
        <dd>This is the description of Idea 10.</dd>
        <dd>This is the description of Idea 10.</dd>

        <dt>Idea 22</dt>
        <dd>This is the description of Idea 22.</dd>

        <dt>Idea 15</dt>
        <dd>This is the description of Idea 15.</dd>
    </dl>



</body>

</html>
